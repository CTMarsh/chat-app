<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ChatArk "Constellation" mark — an Ark "A" drawn as connected constellation nodes.
       Palette: Noah's Ark Design System (ark-navy #0a0f1c ground, ark-blue #2f8fff primary,
       ark-cyan #33d6e6 accent, signature blue glow). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0e1730"/>
      <stop offset="55%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#05070e"/>
    </radialGradient>
    <!-- userSpaceOnUse: an objectBoundingBox gradient collapses on the horizontal crossbar line -->
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="128" x2="0" y2="396">
      <stop offset="0%" stop-color="#33d6e6"/>
      <stop offset="100%" stop-color="#2f8fff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- faint background stars -->
  <g fill="#2f8fff" opacity="0.35">
    <circle cx="120" cy="122" r="6"/>
    <circle cx="368" cy="96" r="4"/>
    <circle cx="410" cy="152" r="5"/>
    <circle cx="104" cy="384" r="4"/>
    <circle cx="424" cy="392" r="6"/>
  </g>
  <!-- the Ark constellation -->
  <g filter="url(#glow)">
    <g stroke="url(#line)" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M256 128 L150 396"/>
      <path d="M256 128 L362 396"/>
      <path d="M186 305 L326 305"/>
    </g>
    <circle cx="256" cy="128" r="27" fill="#33d6e6"/>
    <circle cx="150" cy="396" r="21" fill="#2f8fff"/>
    <circle cx="362" cy="396" r="21" fill="#2f8fff"/>
    <circle cx="186" cy="305" r="15" fill="#58b0ff"/>
    <circle cx="326" cy="305" r="15" fill="#58b0ff"/>
  </g>
</svg>
