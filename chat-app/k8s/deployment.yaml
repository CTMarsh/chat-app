apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app
  namespace: chat-app
  labels:
    app.kubernetes.io/name: chat-app
    app.kubernetes.io/part-of: chat-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-app
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: chat-app
          image: gitlab.noahsark.me:5050/cockpit-bot/chat-app/chat-app:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: chat-app-secrets
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
