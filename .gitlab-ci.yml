# ── Workflow: prevent duplicate pipelines ──────────────────
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ── Security Scanning Templates ───────────────────────────
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - lint
  - test
  - build
  - scan
  - deploy
  - release

variables:
  REGISTRY: "$CI_REGISTRY"
  IMAGE: "$CI_REGISTRY_IMAGE/chat-app"

# ── Stage 1: Lint & Type Check ──────────────────────────────
lint:
  stage: lint
  image: node:22.23.4-alpine
  needs: []
  interruptible: true
  cache:
    key:
      files:
        - chat-app/package-lock.json
    paths:
      - chat-app/node_modules/
  script:
    - cd chat-app
    - npm ci
    - echo "=== TypeScript Type Check ==="
    - npx tsc --noEmit --pretty
    - echo "=== Lint passed ==="
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID

# ── Stage 2: Unit Tests (BLOCKING — never allow_failure) ──
# Pins the security helpers behind the public/unauth API surface: the SSRF guard
# on /api/link-preview and the per-IP rate limiter + widget authz predicates on
# the unauthenticated /api/widget/* routes. If this job goes red the pipeline
# stops — it must never be marked allow_failure.
test:unit:
  stage: test
  image: node:22.23.4-alpine
  needs: []
  interruptible: true
  cache:
    key:
      files:
        - chat-app/package-lock.json
    paths:
      - chat-app/node_modules/
  script:
    - cd chat-app
    - npm ci
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID

# ── Stage 2: Build & Push Container Image ────────────────────
.kaniko-auth: &kaniko-auth
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w 0)\"}}}" > /kaniko/.docker/config.json

# Builder: the osscontainertools kaniko fork. Upstream
# GoogleContainerTools/kaniko was archived 2025-06-03; this fork is maintained,
# drop-in (same /kaniko/executor flags, same DOCKER_CONFIG=/kaniko/.docker) and,
# unlike rootless BuildKit or Buildah, runs on the chris-pc-docker Docker
# executor with NO privileged mode and NO seccomp/apparmor relaxation — both of
# those failed there with "operation not permitted" under default settings.
# Pinned by digest; bump tag+digest together.
#   https://github.com/osscontainertools/kaniko
#
# MR pipelines build too (catch build breaks pre-merge) but push only to the
# scratch repo  <project>/mr-builds/chat-app:<sha>  — never to the deployed
# <project>/chat-app  repo and never :latest.
build:
  stage: build
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.29.1-debug@sha256:ebc38a988e5aa1aaea99240e931aeeeff9d8e6bb5a0bd0e00eaf79973bf0a773
    entrypoint: [""]
  <<: *kaniko-auth
  needs:
    - job: lint
    - job: test:unit
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    # Without this, every intermediate cache push also (re)writes the digest
    # file and builds the full output (fork issue #1329, fixed behind this flag
    # in v1.29.0 via PR #1223). REMOVE-WHEN the fork makes it the default.
    FF_KANIKO_ISOLATE_CACHE_PUSH: "1"
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        BUILD_IMAGE="$IMAGE"
        EXTRA_DEST="--destination $IMAGE:latest"
      else
        BUILD_IMAGE="$CI_REGISTRY_IMAGE/mr-builds/chat-app"
        EXTRA_DEST=""
      fi
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/chat-app"
      --dockerfile "$CI_PROJECT_DIR/chat-app/Dockerfile"
      --build-arg "NPM_TOKEN=$NPM_TOKEN"
      --build-arg "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
      --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
      --destination "$BUILD_IMAGE:$CI_COMMIT_SHORT_SHA"
      $EXTRA_DEST
      --cache=true
      --cache-repo="$CI_REGISTRY_IMAGE/cache/chat-app"
      --digest-file /kaniko/image-digest
    # The digest file MUST live outside the build context ($CI_PROJECT_DIR/chat-app,
    # and the whole $CI_PROJECT_DIR): anything written into the context mid-build
    # changes the `COPY . .` hash between kaniko's two cache-key passes and trips
    # the fork's executor.compositekey.pass-match assertion (issue #1329). Copy it
    # in only after the executor has exited.
    - cp /kaniko/image-digest "$CI_PROJECT_DIR/image-digest"
    - test -s "$CI_PROJECT_DIR/image-digest"
    # Hand the exact pushed digest to later jobs, so Trivy scans the bytes that
    # were pushed rather than whatever a mutable tag points at by then.
    - echo "IMAGE_REF=$BUILD_IMAGE@$(cat "$CI_PROJECT_DIR/image-digest")" > build.env
    - cat build.env
  artifacts:
    paths:
      - image-digest
    reports:
      dotenv: build.env
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID

# ── Stage: Trivy Image Scan (fail on CRITICAL) ───────────────
# chat-app had NO container image CVE scanning. The SAST and Secret-Detection
# templates included above scan SOURCE — neither one ever looks at the built
# image, so every OS/base-layer CVE in the shipped container was unmeasured.
# Mirrors the gate already running in tars / notify / status-page.
#
# --db-repository is given TWICE on purpose. trivy only auto-falls-back to the
# next repository on 429/5xx; the GCR mirror currently answers 404, which is NOT
# a fallback trigger, so ghcr.io must be listed FIRST and the mirror kept only as
# a genuine-rate-limit backstop.
#
# NO allow_failure. A security gate that cannot fail is not a gate.
trivy:scan:
  stage: scan
  image:
    name: aquasec/trivy:0.62.1
    entrypoint: [""]
  needs:
    - job: build
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
    DB_FLAGS: "--db-repository ghcr.io/aquasecurity/trivy-db --db-repository mirror.gcr.io/aquasec/trivy-db"
  script:
    # IMAGE_REF (repo@sha256:...) comes from build's dotenv report.
    - test -n "$IMAGE_REF" || { echo "IMAGE_REF missing from build dotenv"; exit 1; }
    - echo "Scanning $IMAGE_REF"
    - if [ -f .trivyignore ]; then IGN="--ignorefile .trivyignore"; else IGN=""; fi
    - trivy image $DB_FLAGS --exit-code 0 --severity CRITICAL,HIGH --format table "$IMAGE_REF"
    - trivy image $DB_FLAGS --exit-code 0 --severity CRITICAL,HIGH --format json --output trivy-chat-app.json "$IMAGE_REF"
    - trivy image $DB_FLAGS --exit-code 1 --severity CRITICAL $IGN --format table "$IMAGE_REF" >/dev/null || CRITICAL_FOUND=1
    - if [ "${CRITICAL_FOUND:-0}" = "1" ]; then echo "CRITICAL vulnerabilities found - failing pipeline"; exit 1; fi
    - echo "No unignored CRITICAL vulnerabilities."
  artifacts:
    paths:
      - trivy-chat-app.json
    expire_in: 30 days
    when: always
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID

# ── Stage 3: Deploy to Kubernetes ────────────────────────────
deploy:k8s:
  stage: deploy
  # alpine/git sets ENTRYPOINT ["git"]; the Docker executor (chris-pc-docker) would run the
  # job shell as `git sh` and fail with "git: 'sh' is not a git command". Clear it.
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  needs:
    - job: build
    # Gate the deploy on the scan, otherwise the scan is decorative: without this
    # `needs`, deploy:k8s starts as soon as build finishes and ships the image
    # regardless of the CVE result.
    - job: trivy:scan
  resource_group: production
  variables:
    MANIFEST_PROJECT_ID: "41"
  script:
    - apk add --no-cache curl
    - git clone https://oauth2:${GITLAB_MANIFEST_PAT}@gitlab.noahsark.me/homelab/k8s-manifests.git
    - cd k8s-manifests
    - DEPLOY_BRANCH="ci/chat-app-deploy-${CI_COMMIT_SHORT_SHA}"
    - git checkout -b "$DEPLOY_BRANCH"
    - 'sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${CI_COMMIT_SHORT_SHA}|" apps/chat-app/deployment.yaml'
    - git config user.email "ci-bot@noahsark.me"
    - git config user.name "GitLab CI"
    - git add apps/chat-app/deployment.yaml
    - |
      git commit -m "ci(chat-app): deploy ${CI_COMMIT_SHORT_SHA}

      Pipeline: ${CI_PIPELINE_URL}
      Triggered by: ${GITLAB_USER_LOGIN}"
    - git push -u origin "$DEPLOY_BRANCH"
    # Create MR via GitLab API - k8s-manifests main is protected, direct push is rejected
    - |
      MR_RESPONSE=$(curl -sf --request POST \
        --url "https://gitlab.noahsark.me/api/v4/projects/${MANIFEST_PROJECT_ID}/merge_requests" \
        --header "PRIVATE-TOKEN: ${GITLAB_MANIFEST_PAT}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"${DEPLOY_BRANCH}\",
          \"target_branch\": \"main\",
          \"title\": \"ci(chat-app): deploy ${CI_COMMIT_SHORT_SHA}\",
          \"description\": \"Automated deploy from chat-app pipeline ${CI_PIPELINE_ID}.\\n\\nPipeline: ${CI_PIPELINE_URL}\\nTriggered by: ${GITLAB_USER_LOGIN}\",
          \"assignee_id\": 7,
          \"reviewer_ids\": [1],
          \"remove_source_branch\": true,
          \"squash\": true
        }")
      MR_IID=$(echo "$MR_RESPONSE" | grep -o '"iid":[0-9]*' | head -1 | grep -o '[0-9]*')
      echo "MR !${MR_IID} created - merge to deploy"
      echo "https://gitlab.noahsark.me/ctmarsh/k8s-manifests/-/merge_requests/${MR_IID}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: https://chat.noahsark.me

# ── Stage 4: ISC Release (mandatory) ────────────────────────
create-isc-release:
  stage: release
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - |
      ISC_BRANCH=$(echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -oP '^isc/.+' || true)
      if [ -z "$ISC_BRANCH" ]; then exit 0; fi
      TAG_NAME=$(echo "$ISC_BRANCH" | sed 's/\//-/g')
      curl --silent --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_PAT" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" \
        --data-urlencode "name=Release: $CI_MERGE_REQUEST_TITLE" \
        --data-urlencode "tag_name=$TAG_NAME" \
        --data-urlencode "ref=main" \
        --data-urlencode "description=Released from ISC branch $ISC_BRANCH"
  environment: production

# ── Self-notification on Deploy ───────────────────────────
notify:success:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: deploy:k8s
  script:
    - |
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"✅ Chat-App Deployed\", \"body\": \"$CI_COMMIT_SHORT_SHA deployed to production\", \"priority\": \"low\"}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: on_success
  allow_failure: true

notify:failure:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: deploy:k8s
  script:
    - |
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"❌ Chat-App Deploy Failed\", \"body\": \"Pipeline $CI_PIPELINE_ID failed on $CI_COMMIT_SHORT_SHA\", \"priority\": \"high\"}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: on_failure
  allow_failure: true
