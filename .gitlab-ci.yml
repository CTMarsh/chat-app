# ── Workflow: prevent duplicate pipelines ──────────────────
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ── Security Scanning Templates ───────────────────────────
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - lint
  - test
  - build
  - deploy
  - release

variables:
  REGISTRY: "$CI_REGISTRY"
  IMAGE: "$CI_REGISTRY_IMAGE/chat-app"

# ── Stage 1: Lint & Type Check ──────────────────────────────
lint:
  stage: lint
  image: node:20-alpine
  needs: []
  interruptible: true
  cache:
    key:
      files:
        - chat-app/package-lock.json
    paths:
      - chat-app/node_modules/
  script:
    - cd chat-app
    - npm ci
    - echo "=== TypeScript Type Check ==="
    - npx tsc --noEmit --pretty
    - echo "=== Lint passed ==="
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID

# ── Stage 2: Build & Push Container Image ────────────────────
.kaniko-auth: &kaniko-auth
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64)\"}}}" > /kaniko/.docker/config.json

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  <<: *kaniko-auth
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/chat-app"
      --dockerfile "$CI_PROJECT_DIR/chat-app/Dockerfile"
      --build-arg "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
      --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
      --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$IMAGE:latest"
      --cache=true
      --cache-repo="$CI_REGISTRY_IMAGE/cache/chat-app"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage 3: Deploy to Kubernetes ────────────────────────────
deploy:k8s:
  stage: deploy
  image:
    name: alpine/k8s:1.35.2
    entrypoint: [""]
  needs:
    - job: build
  resource_group: production
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - echo "=== Updating image tag ==="
    - kubectl set image deployment/chat-app chat-app="$IMAGE:$CI_COMMIT_SHORT_SHA" -n chat-app
    - echo "=== Waiting for rollout ==="
    - kubectl rollout status deployment/chat-app -n chat-app --timeout=300s
    - echo "=== Deployment complete ==="
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: https://chat.noahsark.me

# ── Stage 4: ISC Release (mandatory) ────────────────────────
create-isc-release:
  stage: release
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - |
      ISC_BRANCH=$(echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -oP '^isc/.+' || true)
      if [ -z "$ISC_BRANCH" ]; then exit 0; fi
      TAG_NAME=$(echo "$ISC_BRANCH" | sed 's/\//-/g')
      curl --silent --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_PAT" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" \
        --data-urlencode "name=Release: $CI_MERGE_REQUEST_TITLE" \
        --data-urlencode "tag_name=$TAG_NAME" \
        --data-urlencode "ref=main" \
        --data-urlencode "description=Released from ISC branch $ISC_BRANCH"
  environment: production

# ── Self-notification on Deploy ───────────────────────────
notify:success:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: deploy:k8s
  script:
    - |
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"✅ Chat-App Deployed\", \"body\": \"$CI_COMMIT_SHORT_SHA deployed to production\", \"priority\": \"low\"}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: on_success
  allow_failure: true

notify:failure:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: deploy:k8s
  script:
    - |
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"❌ Chat-App Deploy Failed\", \"body\": \"Pipeline $CI_PIPELINE_ID failed on $CI_COMMIT_SHORT_SHA\", \"priority\": \"high\"}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: on_failure
  allow_failure: true
