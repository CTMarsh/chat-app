# ── Workflow: prevent duplicate pipelines ──────────────────
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ── Security Scanning Templates ───────────────────────────
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - lint
  - test
  - build
  - deploy
  - release

variables:
  REGISTRY: "$CI_REGISTRY"
  IMAGE: "$CI_REGISTRY_IMAGE/chat-app"

# ── Stage 1: Lint & Type Check ──────────────────────────────
lint:
  stage: lint
  image: node:20-alpine
  needs: []
  interruptible: true
  cache:
    key:
      files:
        - chat-app/package-lock.json
    paths:
      - chat-app/node_modules/
  script:
    - cd chat-app
    - npm ci
    - echo "=== TypeScript Type Check ==="
    - npx tsc --noEmit --pretty
    - echo "=== Lint passed ==="
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_IID

# ── Stage 2: Build & Push Container Image ────────────────────
.kaniko-auth: &kaniko-auth
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64)\"}}}" > /kaniko/.docker/config.json

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  <<: *kaniko-auth
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/chat-app"
      --dockerfile "$CI_PROJECT_DIR/chat-app/Dockerfile"
      --build-arg "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
      --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
      --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$IMAGE:latest"
      --cache=true
      --cache-repo="$CI_REGISTRY_IMAGE/cache/chat-app"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage 3: Deploy to Kubernetes ────────────────────────────
deploy:k8s:
  stage: deploy
  image: alpine/git:2.47.2
  needs:
    - job: build
  resource_group: production
  variables:
    MANIFEST_PROJECT_ID: "41"
  script:
    - apk add --no-cache curl
    - git clone https://oauth2:${GITLAB_MANIFEST_PAT}@gitlab.noahsark.me/ctmarsh/k8s-manifests.git
    - cd k8s-manifests
    - DEPLOY_BRANCH="ci/chat-app-deploy-${CI_COMMIT_SHORT_SHA}"
    - git checkout -b "$DEPLOY_BRANCH"
    - 'sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${CI_COMMIT_SHORT_SHA}|" apps/chat-app/deployment.yaml'
    - git config user.email "ci-bot@noahsark.me"
    - git config user.name "GitLab CI"
    - git add apps/chat-app/deployment.yaml
    - |
      git commit -m "ci(chat-app): deploy ${CI_COMMIT_SHORT_SHA}

      Pipeline: ${CI_PIPELINE_URL}
      Triggered by: ${GITLAB_USER_LOGIN}"
    - git push -u origin "$DEPLOY_BRANCH"
    # Create MR via GitLab API - k8s-manifests main is protected, direct push is rejected
    - |
      MR_RESPONSE=$(curl -sf --request POST \
        --url "https://gitlab.noahsark.me/api/v4/projects/${MANIFEST_PROJECT_ID}/merge_requests" \
        --header "PRIVATE-TOKEN: ${GITLAB_MANIFEST_PAT}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"${DEPLOY_BRANCH}\",
          \"target_branch\": \"main\",
          \"title\": \"ci(chat-app): deploy ${CI_COMMIT_SHORT_SHA}\",
          \"description\": \"Automated deploy from chat-app pipeline ${CI_PIPELINE_ID}.\\n\\nPipeline: ${CI_PIPELINE_URL}\\nTriggered by: ${GITLAB_USER_LOGIN}\",
          \"assignee_id\": 5,
          \"reviewer_ids\": [1],
          \"remove_source_branch\": true,
          \"squash\": true
        }")
      MR_IID=$(echo "$MR_RESPONSE" | grep -o '"iid":[0-9]*' | head -1 | grep -o '[0-9]*')
      echo "MR !${MR_IID} created - merge to deploy"
      echo "https://gitlab.noahsark.me/ctmarsh/k8s-manifests/-/merge_requests/${MR_IID}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: https://chat.noahsark.me

# ── Stage 4: ISC Release (mandatory) ────────────────────────
create-isc-release:
  stage: release
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - |
      ISC_BRANCH=$(echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -oP '^isc/.+' || true)
      if [ -z "$ISC_BRANCH" ]; then exit 0; fi
      TAG_NAME=$(echo "$ISC_BRANCH" | sed 's/\//-/g')
      curl --silent --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_PAT" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" \
        --data-urlencode "name=Release: $CI_MERGE_REQUEST_TITLE" \
        --data-urlencode "tag_name=$TAG_NAME" \
        --data-urlencode "ref=main" \
        --data-urlencode "description=Released from ISC branch $ISC_BRANCH"
  environment: production

# ── Self-notification on Deploy ───────────────────────────
notify:success:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: deploy:k8s
  script:
    - |
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"✅ Chat-App Deployed\", \"body\": \"$CI_COMMIT_SHORT_SHA deployed to production\", \"priority\": \"low\"}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: on_success
  allow_failure: true

notify:failure:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: deploy:k8s
  script:
    - |
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"❌ Chat-App Deploy Failed\", \"body\": \"Pipeline $CI_PIPELINE_ID failed on $CI_COMMIT_SHORT_SHA\", \"priority\": \"high\"}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: on_failure
  allow_failure: true
